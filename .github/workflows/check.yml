name: Check toolbox

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install actionlint and ShellCheck
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          mkdir -p .work/check-tools
          curl --fail --location --retry 3 \
            "https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C .work/check-tools actionlint
          sudo apt-get update
          sudo apt-get install --yes shellcheck lua5.4 lua-cjson
      - name: Check workflows and shell scripts
        shell: bash
        run: |
          .work/check-tools/actionlint -color
          while IFS= read -r -d '' script; do
            bash -n "$script"
            shellcheck -x "$script"
          done < <(find tools -type f -name '*.sh' -print0)
      - name: Check timelapse Lua, shell worker, and recording lifecycle
        run: |
          while IFS= read -r -d '' script; do luac5.4 -p "$script"; done \
            < <(find extensions/timelapse-recorder tests/timelapse -type f -name '*.lua' -print0)
          sh -n extensions/timelapse-recorder/workers/encode.sh
          shellcheck extensions/timelapse-recorder/workers/encode.sh
          lua5.4 tests/timelapse/run.lua
      - name: Check version configuration and target matrix
        shell: bash
        run: |
          config=$(bash tools/aseprite/build.sh resolve)
          jq -e '.matrix.include | length == 4' <<< "$config"
          for target in windows-x64 linux-x64 macos-arm64 macos-x64; do
            config=$(bash tools/aseprite/build.sh resolve --target "$target")
            jq -e --arg target "$target" '.matrix.include | length == 1 and .[0].target == $target' <<< "$config"
          done
          config=$(bash tools/aseprite/build.sh resolve --aseprite-version v1.3.17 --skia-version m124-abcdef)
          jq -e '.aseprite_version == "v1.3.17" and .skia_version == "m124-abcdef"' <<< "$config"
          if bash tools/aseprite/build.sh resolve --target invalid; then exit 1; fi
          if bash tools/aseprite/build.sh resolve --aseprite-version ../invalid; then exit 1; fi
          if bash tools/aseprite/build.sh resolve --skia-version invalid; then exit 1; fi

  timelapse:
    name: Timelapse / ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            runner: windows-2022
          - target: linux-x64
            runner: ubuntu-24.04
          - target: macos-arm64
            runner: macos-15
          - target: macos-x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install FFmpeg on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - name: Install FFmpeg on macOS
        if: runner.os == 'macOS'
        run: command -v ffmpeg || brew install ffmpeg
      - name: Install FFmpeg on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --yes --no-progress
          }
          $encoder = (Get-Command ffmpeg -ErrorAction Stop).Source
          "FFMPEG=$encoder" >> $env:GITHUB_ENV
          "FFPROBE=$(Join-Path (Split-Path -Parent $encoder) 'ffprobe.exe')" >> $env:GITHUB_ENV
      - name: Test actual encoding, cancellation, errors, and extension package
        env:
          CI: 'true'
        run: |
          node --test tests/timelapse/package.test.mjs tests/timelapse/workers.test.mjs
          node tools/timelapse/package.mjs
      - name: Save extension package
        if: matrix.target == 'linux-x64'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: timelapse-recorder
          path: dist/timelapse-recorder-*.aseprite-extension
          if-no-files-found: error
